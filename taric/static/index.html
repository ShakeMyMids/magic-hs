<!DOCTYPE html>
<html lang="it" data-dati="{{DATI}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MAGIC HS</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e1e6eb">
</head>
<body>
<div class="page">

  <header class="barra">
    <a class="logo" href="#classifica" data-marchio aria-label="MAGIC HS, vai a Classifica"><span>MAGIC <b>HS</b></span></a>
    <nav class="schede" aria-label="Sezioni">
      <a href="#classifica" id="tab-classifica" aria-current="page" data-ico="cerca">Classifica</a>
      <a href="#nomenclatura" id="tab-nomenclatura" data-ico="albero">Nomenclatura</a>
      <a href="#profilo" id="tab-profilo" data-ico="utente">Profilo</a>
      <a href="#gestione" id="tab-gestione" data-ico="gestione" hidden>Impostazioni</a>
    </nav>
    <div class="lato">
      <button class="tasto-ico" type="button" id="tema" aria-label="Cambia tema"></button>
      <div class="chi"><span class="iniziali" id="chi-iniziali" aria-hidden="true"></span><b id="chi-nome">…</b>
        <button class="tasto-ico" type="button" id="esci" title="Chiudi MAGIC HS" aria-label="Chiudi MAGIC HS" data-ico="spegni"></button></div>
    </div>
  </header>

  <main>
    <!-- ======================= CLASSIFICA ======================= -->
    <section id="view-classifica" aria-labelledby="tab-classifica">
      <div class="foglio">
        <div class="box domanda">
          <div class="scena" data-scena></div>
          <div class="titolo-riga"><h2>Che merce devi classificare?</h2><span class="dato" id="dato"></span></div>
          <label for="q" hidden>Descrizione della merce (casella 31 del DAU)</label>
          <div class="cerca-merce" data-ico="cerca"><textarea id="q" rows="2" spellcheck="false" autocomplete="off" placeholder="Descrivi la merce da classificare"></textarea></div>
          <div class="avanza" id="avanza" hidden><i></i></div>
          <div class="fila">
            <button class="btn pri" id="vai" type="button" data-ico="bacchetta">Classifica</button>
            <button class="btn" id="ferma" type="button" data-ico="ferma" hidden>Ferma</button>
            <div class="stato" id="stato" role="status" aria-live="polite"></div>
          </div>
          <div id="msg"></div>
          <div class="fila" id="fornite" hidden></div>
        </div>
      </div>
      <div id="esito" style="margin-top:16px"></div>
    </section>

    <!-- ======================= NOMENCLATURA ======================= -->
    <section id="view-nomenclatura" aria-labelledby="tab-nomenclatura" hidden>
      <div class="foglio">
        <div class="box">
          <div class="lab" data-ico="albero">Nomenclatura TARIC</div>
          <div class="fila">
            <label for="nq" hidden>Cerca nella nomenclatura</label>
            <input class="campo" id="nq" type="search" autocomplete="off" spellcheck="false" placeholder="Codice o parola da cercare">
            <button class="btn" id="nq-x" type="button" data-ico="chiudi">Azzera</button>
          </div>
        </div>
        <div class="box albero-box">
          <div class="albero" id="albero"></div>
        </div>
      </div>
    </section>
    <!-- ======================= PROFILO ======================= -->
    <section id="view-profilo" class="sezione" aria-labelledby="tab-profilo" hidden></section>

    <!-- ======================= GESTIONE (amministratori) ======================= -->
    <section id="view-gestione" class="sezione" aria-labelledby="tab-gestione" hidden></section>
  </main>

  <footer class="piede">
    <p><span id="fonte"></span> Strumento non ufficiale, senza valore legale: prima di dichiarare verifica codice e misure su AIDA o sul TARIC dell'UE.</p>
  </footer>
</div>

<script src="/static/js/icone.js"></script>
<script src="/static/js/disegni.js"></script>
<script src="/static/js/comune.js"></script>
<script src="{{DATI}}nomenclatura.js"></script>
<script src="{{DATI}}rif.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/profilo.js"></script>
<script src="/static/js/gestione.js"></script>
</body>
</html>
