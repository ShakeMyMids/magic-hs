<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Password dimenticata · MAGIC HS</title>
<link rel="stylesheet" href="/static/css/app.css">

<body class="accesso" data-pagina="password-dimenticata">
<div class="page">
  <header class="barra">
    <a class="logo" href="/" data-marchio><span>MAGIC <b>HS</b></span></a>
    <div class="lato"><button class="tasto-ico" type="button" id="tema" aria-label="Cambia tema"></button></div>
  </header>
  <main>
    <div class="foglio"><div class="box">
      <h2>Password dimenticata</h2>
      <p class="nota">Scrivi l'email del tuo account: ti mandiamo un link per scegliere una nuova password.</p>
      <form class="modulo" id="modulo" novalidate>
        <label>Email<input class="campo" type="email" name="email" autocomplete="username" required autofocus></label>
        <div class="fila"><button class="btn pri" type="submit">Mandami il link</button></div>
      </form>
      <div id="esito" role="alert"></div>
      <div class="sotto-link"><a href="/accedi">Torna all'accesso</a></div>
    </div></div>
  </main>
  <footer class="piede"><p>Strumento non ufficiale, senza valore legale: prima di dichiarare verifica sempre codice e misure su AIDA o sul TARIC dell'UE.</p></footer>
</div>

<script src="/static/js/comune.js"></script>
