name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Controllo sintassi JavaScript
        run: for f in taric/static/js/*.js; do node --check "$f"; done
      - name: Controllo degli script del server
        run: shellcheck -S style server/installa.sh server/magic-hs
