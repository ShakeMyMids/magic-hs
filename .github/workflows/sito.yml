name: Sito
# Costruisce la versione sito di MAGIC HS (strumenti/sito.py) con i dati TARIC degli ultimi mesi della pagina «dati» e la
# pubblica su GitHub Pages (Settings > Pages > Source: GitHub Actions). Parte quando cambiano le pagine del programma su
# main, dopo il flusso «Dati TARIC» (che lo avvia appena pubblica un mese nuovo) oppure a mano.
on:
  push:
    branches: [main]
    paths: ["taric/static/**", "taric/__init__.py", "taric/dati.py", "strumenti/sito.py", ".github/workflows/sito.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sito
  cancel-in-progress: false
jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Dati degli ultimi tre mesi dalla pagina «dati»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dati-pronti
          gh release view dati --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -E '^dati-[0-9]{4}-[0-9]{2}-01\.zip$' | sort -r | head -n 3 \
            | while read -r nome; do gh release download dati --repo "$GITHUB_REPOSITORY" --pattern "$nome" --dir dati-pronti; done
          ls -l dati-pronti
      - name: Costruisci il sito
        run: python strumenti/sito.py --uscita _sito dati-pronti/*.zip
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sito

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url }}
    steps:
      - id: pagine
        uses: actions/deploy-pages@v5
