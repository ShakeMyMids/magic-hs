name: Dati TARIC dei mesi passati
# Prepara dall'archivio della Commissione su CIRCABC i dati TARIC dei mesi passati (strumenti/dati_storici.py, con gli
# stessi controlli del sito) e li pubblica nella pagina «dati» come dati-AAAA-MM-01.zip, saltando i mesi già pubblicati.
# Servono per consultare le misure a una data passata. Si avvia a mano: Actions > Dati TARIC dei mesi passati >
# Run workflow. CIRCABC ha le estrazioni da luglio 2025. A ogni push sul ramo archivio-storico fa una prova su tre mesi
# scelti per i loro formati, senza pubblicare (i file restano tra gli artefatti del giro).
on:
  workflow_dispatch:
    inputs:
      da:
        description: "Primo mese AAAA-MM"
        type: string
        default: "2025-07"
      a:
        description: "Ultimo mese AAAA-MM (vuoto = il mese scorso)"
        type: string
        default: ""
  push:
    branches: [archivio-storico]
permissions:
  contents: read
concurrency: dati-taric
jobs:
  storici:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Mesi da preparare
        env:
          GH_TOKEN: ${{ github.token }}
          DA: ${{ inputs.da }}
          A: ${{ inputs.a }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "MESI=2025-07 2025-11 2026-05" >> "$GITHUB_ENV"; exit 0
          fi
          a="${A:-$(TZ=Europe/Rome date -d "$(date +%Y-%m-15) -1 month" +%Y-%m)}"
          for m in "$DA" "$a"; do [[ "$m" =~ ^[0-9]{4}-[0-9]{2}$ ]] || { echo "Mese non valido: $m"; exit 1; }; done
          pubblicati=$(gh release view dati --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          mesi=""; m="$DA"
          while [[ "$m" < "$a" || "$m" == "$a" ]]; do
            grep -qx "dati-$m-01.zip" <<< "$pubblicati" || mesi="$mesi $m"
            m=$(date -d "$m-01 +1 month" +%Y-%m)
          done
          echo "Da preparare:${mesi:- nessuno}"
          echo "MESI=$mesi" >> "$GITHUB_ENV"
      - name: Prepara i mesi
        if: env.MESI != ''
        run: |
          set +e
          python -I strumenti/dati_storici.py $MESI --uscita dist
          echo "ESITO=$?" >> "$GITHUB_ENV"
      - name: Pubblica nella pagina «dati»
        if: github.event_name == 'workflow_dispatch' && env.MESI != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dati --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create dati --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "Dati TARIC" --notes "Dati TARIC del mese pronti per MAGIC HS (li scarica da solo il sito). Fonte: Commissione europea, DG TAXUD."
          for f in dist/dati-*.zip; do [ -f "$f" ] && gh release upload dati "$f" --repo "$GITHUB_REPOSITORY"; done; true
      - uses: actions/upload-artifact@v7
        if: env.MESI != ''
        with:
          name: dati-mesi-passati
          path: dist/
          if-no-files-found: ignore
      - name: Esito
        if: env.MESI != ''
        run: '[ "$ESITO" = 0 ] || { echo "Alcuni mesi non sono riusciti: vedi «Prepara i mesi»."; exit 1; }'
