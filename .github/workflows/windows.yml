name: Programma per Windows
# Costruisce il programma per Windows, lo prova su un vero Windows (avvio dalla cartella scaricata, copia sul PC,
# dati del mese, chiave IA protetta da Windows, versione nuova, chiusura) e pubblica i file nella pagina delle
# versioni di GitHub, con il tag
# v<versione di taric/__init__.py>:
# - da solo, quando su main arriva una versione che non ha ancora la sua pagina (basta unire la PR che cambia
#   __version__); una versione già pubblicata non si tocca;
# - per i tag v*, oppure da Actions > Programma per Windows > Run workflow con «pubblica»: in questi casi i file
#   di una pagina già esistente vengono sostituiti.
# Le versioni non solo numeriche (per esempio 1.3.0-prova) escono come «pre-release»: MAGIC HS non le propone.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["taric/**", "windows/**", "strumenti/pacchetto_windows.py", "requirements.txt", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblica i file nella pagina delle versioni (tag v + versione del programma)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pacchetto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python strumenti/pacchetto_windows.py --uscita dist
      - uses: actions/upload-artifact@v7
        with:
          name: magic-hs-windows
          path: dist/*.zip
          retention-days: 30

  prova:
    needs: pacchetto
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: magic-hs-windows
          path: dist
      - name: Primo avvio da una cartella scaricata, dati del mese, chiave IA protetta da Windows, versione nuova
        shell: pwsh
        timeout-minutes: 20
        env:
          MAGIC_HS_SENZA_BROWSER: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $kit = Get-ChildItem dist -Filter "*.zip" | Where-Object { $_.Name -cmatch '^MAGIC-HS-[0-9]' } | Select-Object -First 1
          $scaricati = Join-Path $env:RUNNER_TEMP "Download (prova) & altro"
          Expand-Archive $kit.FullName -DestinationPath $scaricati
          $cartella = Join-Path $scaricati "MAGIC HS"
          $avvio = Join-Path $cartella "Avvia MAGIC HS.cmd"
          $versione = (Get-Content (Join-Path $cartella "programma\versione.txt") -Raw).Trim()
          # chi arriva dalla vecchia cartella condivisa (1.2): il servizio IA scelto li' si importa una volta
          '{"sale": "sale9", "ia": {"fornitore": "openai", "url": "https://risorsa.openai.azure.com/openai/v1", "modello": "gpt-prova", "chiave_cifrata": "mhs1:CNz-2R7UDLmT1RJBUPqxlFTJaaaeMgypgyXLn6j2XwmmR-02tFr-vSELmNeavw=="}}' |
            Set-Content (Join-Path $cartella "impostazioni.json") -Encoding utf8
          # la cartella di avvio puo' essere in sola lettura: il programma non ci scrive mai
          Get-ChildItem $cartella -Recurse -File | ForEach-Object { $_.IsReadOnly = $true }
          $vuoto = Join-Path $env:RUNNER_TEMP "vuoto.txt"
          Set-Content $vuoto ""
          # come il doppio clic di Esplora file; l'ingresso vuoto evita che un «pause» blocchi la prova
          function Avvia {
            $p = Start-Process -FilePath $avvio -WorkingDirectory $cartella -PassThru -NoNewWindow -RedirectStandardInput $vuoto
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "l'avvio ha restituito $($p.ExitCode)" }
          }
          function Aspetta($mia) {
            $file = Join-Path $mia "istanza.json"
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $file) {
                $info = Get-Content $file -Raw | ConvertFrom-Json
                try { if ((Invoke-RestMethod "http://127.0.0.1:$($info.porta)/api/locale/ping").app -eq "magic-hs") { return $info } } catch { }
              }
            }
            Get-Content (Join-Path $mia "registro.txt") -ErrorAction SilentlyContinue
            throw "il programma non risponde"
          }
          function Entra($info) {
            $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest "http://127.0.0.1:$($info.porta)/entra?k=$($info.chiave)" -WebSession $s | Out-Null
            return $s
          }
          function Chiudi($info, $s, $mia) {
            Invoke-RestMethod -Method Post "http://127.0.0.1:$($info.porta)/api/locale/chiudi" -Headers $h -WebSession $s | Out-Null
            for ($i = 0; $i -lt 20 -and (Test-Path (Join-Path $mia "istanza.json")); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path (Join-Path $mia "istanza.json")) { throw "il programma non si e' chiuso" }
          }
          $h = @{ "X-Taric" = "1" }
          $mia = Join-Path $env:LOCALAPPDATA "MAGIC HS"
          $py = Join-Path $mia "programma\$versione\python\python.exe"
          $controllo = Join-Path $env:RUNNER_TEMP "controllo_chiave.py"
          @'
          import json, sqlite3, sys
          from pathlib import Path
          from taric import segreti
          dati, attesa = Path(sys.argv[1]), sys.argv[2]
          c = sqlite3.connect(dati / "taric.db")
          ia = json.loads(c.execute("SELECT valore FROM impostazioni WHERE chiave = 'ia'").fetchone()[0])
          c.close()
          print("chiave salvata come", ia["chiave"][:6] + "...")
          assert ia["chiave"].startswith("dpapi:"), "chiave non protetta da Windows"
          assert segreti.svela(ia["chiave"], dati) == attesa, "chiave non leggibile"
          assert not any(attesa.encode() in f.read_bytes() for f in dati.glob("taric.db*")), "chiave in chiaro nel database"
          assert not (dati / "segreto-ia.key").exists()
          print("chiave protetta da Windows: ok")
          '@ | Set-Content $controllo -Encoding utf8

          # 1. primo avvio: copia sul PC, servizio IA importato, dati del mese (pronti da GitHub o preparati sul PC)
          Avvia
          $info = Aspetta $mia
          $base = "http://127.0.0.1:$($info.porta)"
          $s = Entra $info
          $io = Invoke-RestMethod "$base/api/io" -WebSession $s
          "programma $($io.programma.versione), ruolo $($io.ruolo), IA $($io.ia.nome)"
          if ($io.programma.versione -ne $versione -or $io.ruolo -ne "amministratore" -or -not $io.ia.configurata) { throw "primo avvio inatteso" }
          & $py -I $controllo (Join-Path $mia "dati") "sk-vecchia-123"
          if ($LASTEXITCODE -ne 0) { throw "servizio IA importato male" }
          for ($i = 0; $i -lt 200 -and (-not $io.dati.versione -or $io.dati.aggiornamento); $i++) {
            Start-Sleep -Seconds 4
            try { $io = Invoke-RestMethod "$base/api/io" -WebSession $s } catch { "nuovo tentativo: $_" }
            if ($i % 8 -eq 0) { "dati: $($io.dati.aggiornamento)" }
            if (-not $io.dati.versione -and -not $io.dati.aggiornamento -and $i -gt 10) { break }
          }
          $agg = Invoke-RestMethod "$base/api/admin/dati" -WebSession $s
          if (-not $io.dati.versione) {
            Get-Content (Join-Path $mia "registro.txt")
            $agg.ultimi | Format-List
            if ($agg.ultimi) { Invoke-RestMethod "$base/api/admin/dati/registro/$($agg.ultimi[0].id)" -WebSession $s }
            throw "dati del mese non installati"
          }
          "dati installati $($io.dati.versione): $($agg.ultimi[0].messaggio)"

          # 2. nuova chiave scelta dall'utente: protetta da Windows, mai in chiaro
          $corpo = @{ fornitore = "openai"; url = "http://127.0.0.1:9/v1"; modello = "prova"; chiave = "sk-prova-windows-1234" } | ConvertTo-Json
          Invoke-RestMethod -Method Put "$base/api/admin/locale/ia" -Headers $h -WebSession $s -ContentType "application/json" -Body $corpo | Out-Null
          $loc = Invoke-RestMethod "$base/api/admin/locale" -WebSession $s
          if (-not $loc.ia.chiave.EndsWith("1234") -or $loc.ia.chiave_illeggibile -or -not $loc.attiva) { throw "chiave non salvata" }
          & $py -I $controllo (Join-Path $mia "dati") "sk-prova-windows-1234"
          if ($LASTEXITCODE -ne 0) { throw "chiave non protetta" }

          # 3. secondo doppio clic: usa la copia gia' aperta
          Avvia
          Start-Sleep -Seconds 8
          if ((Get-Content (Join-Path $mia "istanza.json") -Raw | ConvertFrom-Json).pid -ne $info.pid) { throw "avviata una seconda copia" }

          # 4. HTTPS con i certificati di Windows (truststore), come per l'IA dietro un proxy aziendale
          # (github.com e non api.github.com: dagli indirizzi condivisi delle prove l'API risponde spesso 403 per il limite di richieste)
          & $py -I -c "import truststore; truststore.inject_into_ssl(); import httpx; r = httpx.get('https://github.com/', timeout=30); print('HTTPS', r.status_code); assert r.status_code == 200"
          if ($LASTEXITCODE -ne 0) { throw "HTTPS con truststore non riuscito" }
          Chiudi $info $s $mia

          # 5. versione scaricata dal programma (attuale.txt): l'avvio usa quella, senza copiare di nuovo la cartella
          $locale = Join-Path $mia "programma"
          Copy-Item (Join-Path $locale $versione) (Join-Path $locale "9.9.9") -Recurse
          [IO.File]::WriteAllText((Join-Path $locale "attuale.txt"), "9.9.9`r`n")
          Avvia
          $info = Aspetta $mia
          $s = Entra $info
          $percorso = (Get-Process -Id $info.pid).Path
          "in uso: $percorso"
          if ($percorso -notlike "*\programma\9.9.9\python\*") { throw "l'avvio non usa la versione scaricata" }
          if (-not (Test-Path (Join-Path $locale "$versione\python\pythonw.exe"))) { throw "tolta la versione della cartella di avvio" }
          $io = Invoke-RestMethod "http://127.0.0.1:$($info.porta)/api/io" -WebSession $s
          if (-not $io.ia.configurata -or -not $io.dati.versione) { throw "impostazioni perse" }
          Chiudi $info $s $mia
          Get-Content (Join-Path $mia "registro.txt")

  rilascio:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.pubblica || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: prova
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: magic-hs-windows
          path: dist
      - name: Pagina della versione con i file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' taric/__init__.py)"; fi
          note="Prima installazione: scarica MAGIC-HS-${tag#v}.zip, estrailo dove vuoi e fai doppio clic su «Avvia MAGIC HS» (vedi LEGGIMI.txt). Chi ha già MAGIC HS riceve questa versione da solo. Il file magic-hs-windows è quello che il programma scarica per aggiornarsi."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              echo "La versione $tag è già pubblicata: niente da fare."
            else
              gh release upload "$tag" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            fi
          else
            extra=()
            [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || extra=(--prerelease)
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "MAGIC HS $tag" --notes "$note" "${extra[@]}"
          fi
