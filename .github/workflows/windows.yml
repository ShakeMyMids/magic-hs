name: Programma per Windows
# Costruisce il programma per Windows, lo prova su un vero Windows (avvio dalla cartella, copia sul PC,
# server in ascolto, chiusura) e pubblica i file nella pagina delle versioni di GitHub: per i tag v*, oppure
# da Actions > Programma per Windows > Run workflow con «pubblica» (tag v<versione di taric/__init__.py>).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["taric/**", "windows/**", "strumenti/pacchetto_windows.py", "requirements.txt", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblica i file nella pagina delle versioni (tag v + versione del programma)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pacchetto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python strumenti/pacchetto_windows.py --uscita dist
      - uses: actions/upload-artifact@v7
        with:
          name: magic-hs-windows
          path: dist/*.zip
          retention-days: 30

  prova:
    needs: pacchetto
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: magic-hs-windows
          path: dist
      - name: Avvio dalla cartella condivisa, primo editore, dati del mese e un collega
        shell: pwsh
        timeout-minutes: 20
        env:
          MAGIC_HS_SENZA_BROWSER: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $kit = Get-ChildItem dist -Filter "MAGIC-HS-cartella-*.zip" | Select-Object -First 1
          $onedrive = Join-Path $env:RUNNER_TEMP "OneDrive - Azienda (Prova)"
          Expand-Archive $kit.FullName -DestinationPath $onedrive
          $cond = Join-Path $onedrive "MAGIC HS"
          $avvio = Join-Path $cond "Avvia MAGIC HS.cmd"
          $vuoto = Join-Path $env:RUNNER_TEMP "vuoto.txt"
          Set-Content $vuoto ""
          # come il doppio clic di Esplora file; l'ingresso vuoto evita che un «pause» blocchi la prova
          function Avvia {
            $p = Start-Process -FilePath $avvio -WorkingDirectory $cond -PassThru -NoNewWindow -RedirectStandardInput $vuoto
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "l'avvio ha restituito $($p.ExitCode)" }
          }
          function Aspetta($mia) {
            $file = Join-Path $mia "istanza.json"
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $file) {
                $info = Get-Content $file -Raw | ConvertFrom-Json
                try { if ((Invoke-RestMethod "http://127.0.0.1:$($info.porta)/api/locale/ping").app -eq "magic-hs") { return $info } } catch { }
              }
            }
            Get-Content (Join-Path $mia "registro.txt") -ErrorAction SilentlyContinue
            throw "il programma non risponde"
          }
          function Entra($info) {
            $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest "http://127.0.0.1:$($info.porta)/entra?k=$($info.chiave)" -WebSession $s | Out-Null
            return $s
          }
          $h = @{ "X-Taric" = "1" }

          # 1. chi ha creato la cartella: primo avvio, «Gestisco io», download e pubblicazione dei dati del mese
          $mia = Join-Path $env:LOCALAPPDATA "MAGIC HS"
          Avvia
          $info = Aspetta $mia
          $base = "http://127.0.0.1:$($info.porta)"
          $s = Entra $info
          $io = Invoke-RestMethod "$base/api/io" -WebSession $s
          if (-not $io.locale.puo_gestire -or $io.locale.editore) { throw "atteso: nessuno gestisce ancora MAGIC HS" }
          Invoke-RestMethod -Method Post "$base/api/locale/gestisco-io" -Headers $h -WebSession $s | Out-Null
          $loc = Invoke-RestMethod "$base/api/admin/locale" -WebSession $s
          "programma $($loc.programma.in_uso), editori $($loc.editori -join ', '), cartella $($loc.condivisa)"
          if ($loc.programma.in_uso -ne $loc.programma.pubblicato) { throw "versione inattesa" }
          for ($i = 0; $i -lt 160 -and -not $io.dati.versione; $i++) {
            Start-Sleep -Seconds 5
            $io = Invoke-RestMethod "$base/api/io" -WebSession $s
            if ($i % 6 -eq 0) { "dati: $($io.dati.aggiornamento)" }
          }
          if (-not $io.dati.versione) { Get-Content (Join-Path $mia "registro.txt"); throw "dati del mese non installati" }
          $pubblicati = (Get-Content (Join-Path $cond "dati\attiva.txt") -Raw).Trim()
          "dati installati $($io.dati.versione), pubblicati $pubblicati"
          if ($pubblicati -ne $io.dati.versione) { throw "dati non pubblicati nella cartella" }
          # secondo doppio clic: usa la copia gia' aperta
          Avvia
          Start-Sleep -Seconds 8

          # 2. HTTPS con i certificati di Windows (truststore), come per l'IA dietro un proxy aziendale
          $py = Join-Path $mia "programma\$($loc.programma.in_uso)\python\python.exe"
          & $py -I -c "import truststore; truststore.inject_into_ssl(); import httpx; r = httpx.get('https://api.github.com/zen', timeout=30); print('HTTPS', r.status_code); assert r.status_code == 200"
          if ($LASTEXITCODE -ne 0) { throw "HTTPS con truststore non riuscito" }

          # 3. un collega (altro utente di Windows): riceve i dati dalla cartella e non pubblica
          $env:USERNAME = "collega"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "Collega\AppData\Local"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $mia2 = Join-Path $env:LOCALAPPDATA "MAGIC HS"
          Avvia
          $info2 = Aspetta $mia2
          $s2 = Entra $info2
          $io2 = Invoke-RestMethod "http://127.0.0.1:$($info2.porta)/api/io" -WebSession $s2
          "collega: dati $($io2.dati.versione), editore $($io2.locale.editore), porta $($info2.porta)"
          if ($io2.locale.editore -or $io2.locale.puo_gestire -or $io2.ruolo -ne "utente") { throw "il collega non deve pubblicare" }
          if ($io2.dati.versione -ne $io.dati.versione) { throw "il collega non ha ricevuto i dati" }

          # 4. chiusura dal pulsante
          foreach ($x in @(@($info, $s, $mia), @($info2, $s2, $mia2))) {
            Invoke-RestMethod -Method Post "http://127.0.0.1:$($x[0].porta)/api/locale/chiudi" -Headers $h -WebSession $x[1] | Out-Null
          }
          Start-Sleep -Seconds 5
          Get-Content (Join-Path $mia "registro.txt")
          foreach ($m in @($mia, $mia2)) { if (Test-Path (Join-Path $m "istanza.json")) { throw "il programma non si e' chiuso" } }

  rilascio:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.pubblica
    needs: prova
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: magic-hs-windows
          path: dist
      - name: Pagina della versione con i file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' taric/__init__.py)"; fi
          note="Programma per Windows. Prima installazione: estrai MAGIC-HS-cartella-*.zip nella cartella di OneDrive da condividere (vedi LEGGIMI.txt). Aggiornamento: carica magic-hs-windows-*.zip in Gestione > Cartella condivisa."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "MAGIC HS $tag" --notes "$note"
          fi
